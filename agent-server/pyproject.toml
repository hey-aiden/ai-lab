[project]
name = "langchain-ai"
version = "0.1.0"
description = "ai agent application base on langchain"
readme = "README.md"
authors = [
    { name = "aiden", email = "aidenpeng0504@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "aiomysql>=0.3.2",
    "fastapi>=0.141.1",
    "greenlet>=3.5.5",
    "langchain>=1.3.17",
    "langchain-deepseek>=1.1.0",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "sqlalchemy>=2.0.52",
    "uuid>=1.30",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
dev = "app.main:run"

[tool.uv.build-backend]
module-name = "app"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
