[project]
name = "langchain-camp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.4.0",
    "langchain-deepseek>=1.1.0",
    "langgraph>=1.2.11",
    "python-dotenv>=1.2.3",
]

[project.scripts]
start = "app.main:main"

[tool.uv.build-backend]
module-name = "app"
module-root = "."

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
